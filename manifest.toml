#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "beszel"
name = "Beszel"
description.en = "Lightweight server monitoring"
description.fr = "Monitoring de serveurs"

version = "0.21.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://www.beszel.dev/"
admindoc = "https://beszel.dev/guide/hub-installation#binary"
code = "https://github.com/henrygd/beszel"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/henrygd/beszel/releases/download/v0.21.0/beszel_linux_amd64.tar.gz"
    amd64.sha256 = "c0cbab161f322426228419fbbeab4163dded6464a537cc1e2f92e090892f6368"
    arm64.url = "https://github.com/henrygd/beszel/releases/download/v0.21.0/beszel_linux_arm64.tar.gz"
    arm64.sha256 = "c574e351cc870194e6afaaec36cdfbc2ec2388da767f2f1b544692eb53b8d36e"
    armhf.url = "https://github.com/henrygd/beszel/releases/download/v0.21.0/beszel_linux_arm.tar.gz"
    armhf.sha256 = "291efaf6e11798f8b928ae4dd82b66c06c3e93ca6c72cbc9db3b84638af59fe5"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "beszel_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "beszel_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "beszel_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]

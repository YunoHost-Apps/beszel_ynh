#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "beszel"
name = "Beszel"
description.en = "Lightweight server monitoring"
description.fr = "Monitoring de serveurs"

version = "0.20.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://www.beszel.dev/"
admindoc = "https://beszel.dev/guide/hub-installation#binary"
code = "https://github.com/henrygd/beszel"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/henrygd/beszel/releases/download/v0.20.0/beszel_linux_amd64.tar.gz"
    amd64.sha256 = "35bd36638449b42cd7b090c0151de04e392bd0cd0d8d8241403a332f40d12d76"
    arm64.url = "https://github.com/henrygd/beszel/releases/download/v0.20.0/beszel_linux_arm64.tar.gz"
    arm64.sha256 = "d632417198b622a0148902a6dfa624d444ec99c79f6a2957a90213c7b7199edc"
    armhf.url = "https://github.com/henrygd/beszel/releases/download/v0.20.0/beszel_linux_arm.tar.gz"
    armhf.sha256 = "a25a06cb312c62ba94c4ae64f93f3a315cbdb49f22f1d4da05cd1be604115d9f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "beszel_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "beszel_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "beszel_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]

#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "beszel"
name = "Beszel"
description.en = "Lightweight server monitoring"
description.fr = "Monitoring de serveurs"

version = "0.18.8~ynh2"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://www.beszel.dev/"
admindoc = "https://beszel.dev/guide/hub-installation#binary"
code = "https://github.com/henrygd/beszel"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/henrygd/beszel/releases/download/v0.18.8/beszel_linux_amd64.tar.gz"
    amd64.sha256 = "c4924f01a3def7d307fe7cb9776dee547240b51aa0e7222b7e6d47c2cbdf9916"
    arm64.url = "https://github.com/henrygd/beszel/releases/download/v0.18.8/beszel_linux_arm64.tar.gz"
    arm64.sha256 = "f6d78d0d12c00c45e70317160bdc06bbfff68e02f2387cc7ba3dc4c18375371d"
    armhf.url = "https://github.com/henrygd/beszel/releases/download/v0.18.8/beszel_linux_arm.tar.gz"
    armhf.sha256 = "fffb96d74a95060bfb4cf53fb8807e2fb31e109d30cc96137e76beda6fc835eb"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "beszel_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "beszel_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "beszel_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]

#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "beszel"
name = "Beszel"
description.en = "Lightweight server monitoring"
description.fr = "Monitoring de serveurs"

version = "0.21.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://www.beszel.dev/"
admindoc = "https://beszel.dev/guide/hub-installation#binary"
code = "https://github.com/henrygd/beszel"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/henrygd/beszel/releases/download/v0.21.2/beszel_linux_amd64.tar.gz"
    amd64.sha256 = "7d0b8d9547e36aa05230763fed3d9b75fb5a72e37b9d813712ba1c0c21fed045"
    arm64.url = "https://github.com/henrygd/beszel/releases/download/v0.21.2/beszel_linux_arm64.tar.gz"
    arm64.sha256 = "884f8b16b80032f2782ceead2cae8aaab020232d7277e724cd17bca2b8ef8327"
    armhf.url = "https://github.com/henrygd/beszel/releases/download/v0.21.2/beszel_linux_arm.tar.gz"
    armhf.sha256 = "cbaf5de9ef435448950734dab8b939811e4394d3f85a0397e6b1a2948dd1aaee"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "beszel_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "beszel_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "beszel_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
